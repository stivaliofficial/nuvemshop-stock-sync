name: Importar Acne (por arquivo)

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: 'Arquivo de dados (ex: acne_saias.json)'
        required: true
        default: 'acne_saias.json'
      live:
        description: 'Criar de verdade na loja (desmarcado = so teste)'
        type: boolean
        default: false
      substituir:
        description: 'Se ja existir, APAGAR e recriar (corrige ordem de fotos/preco)'
        type: boolean
        default: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Rodar importador Acne
        env:
          NUVEMSHOP_ACCESS_TOKEN: ${{ secrets.NUVEMSHOP_ACCESS_TOKEN }}
        run: |
          ARGS="--arquivo ${{ inputs.arquivo }}"
          [ "${{ inputs.live }}" = "true" ] && ARGS="$ARGS --live"
          [ "${{ inputs.substituir }}" = "true" ] && ARGS="$ARGS --substituir"
          python import_acne.py $ARGS

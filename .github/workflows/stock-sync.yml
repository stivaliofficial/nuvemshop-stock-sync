name: Nuvemshop Stock Sync

on:
  schedule:
    # Roda todo dia as 09:00 UTC (06:00 no horario de Brasilia)
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pela aba "Actions" do GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # forca o cancelamento se travar por qualquer motivo
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar sincronizacao de estoque
        env:
          NUVEMSHOP_STORE_ID: ${{ secrets.NUVEMSHOP_STORE_ID }}
          NUVEMSHOP_ACCESS_TOKEN: ${{ secrets.NUVEMSHOP_ACCESS_TOKEN }}
        run: python nuvemshop_stock_sync.py

      - name: Salvar log como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-sync-log
          path: stock_sync.log
